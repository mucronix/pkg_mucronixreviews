COM_MUCRONIXREVIEWS_SHORTCODES_DESC="<table class=\"table table-sm\"><thead><tr><th scope=\"col\">Шорткод</th><th scope=\"col\">Что выводит</th><th scope=\"col\">Где работает</th></tr></thead><tbody><tr><td><code>{mucronixreviews}</code></td><td>всё для этой статьи: сводку, форму, отзывы</td><td>в тексте статьи</td></tr><tr><td><code>{mucronixreviews summary}</code></td><td>сводку этой статьи</td><td>в тексте статьи</td></tr><tr><td><code>{mucronixreviews id=123}</code></td><td>всё для статьи 123</td><td>в статьях, в модулях «HTML-код» с параметром «Обработка плагинами», в элементах конструктора YOOtheme Pro, в описаниях и текстовых полях товаров DJ-Catalog2</td></tr><tr><td><code>{mucronixreviews summary id=123}</code></td><td>сводку статьи 123</td><td>в статьях, в модулях «HTML-код» с параметром «Обработка плагинами», в элементах конструктора YOOtheme Pro, в описаниях и текстовых полях товаров DJ-Catalog2</td></tr></tbody></table><ul><li>Абзац, в котором нет ничего, кроме шорткода, заменяется целиком.</li><li>Полный блок статьи выводится на странице один раз, сводка может повторяться. Блок из абзаца с другим текстом выводится сразу после этого абзаца.</li><li>В списках и блогах материалов шорткод выводит только сводку.</li><li>Шаблоны конструктора YOOtheme Pro сами блок под статьёй не показывают: добавьте элемент «Отзывы Mucronix» или шорткод в текстовый элемент. В блогах YOOtheme Pro звёзды выводите полем «Звёзды (сводка)» или элементом, а не шорткодом во вводном тексте.</li></ul>"
