COM_MUCRONIXREVIEWS_SHORTCODES_DESC="<table class=\"table table-sm\"><thead><tr><th scope=\"col\">Shortcode</th><th scope=\"col\">Shows</th><th scope=\"col\">Works</th></tr></thead><tbody><tr><td><code>{mucronixreviews}</code></td><td>everything for this article: the summary, the form, the reviews</td><td>in the text of the article</td></tr><tr><td><code>{mucronixreviews summary}</code></td><td>the summary of this article</td><td>in the text of the article</td></tr><tr><td><code>{mucronixreviews id=123}</code></td><td>everything for the article 123</td><td>in articles, in modules of the type Custom with Prepare Content, in elements of the YOOtheme Pro builder, in the descriptions and text fields of DJ-Catalog2 products</td></tr><tr><td><code>{mucronixreviews summary id=123}</code></td><td>the summary of the article 123</td><td>in articles, in modules of the type Custom with Prepare Content, in elements of the YOOtheme Pro builder, in the descriptions and text fields of DJ-Catalog2 products</td></tr></tbody></table><ul><li>A paragraph that holds nothing but the shortcode is replaced as a whole.</li><li>The whole block of an article is shown once on a page; the summary can be repeated. A block in a paragraph with other text goes right after the paragraph.</li><li>In lists and blogs of articles a shortcode shows only the summary.</li><li>Templates of the YOOtheme Pro builder do not show the block under the article by itself: add the element \"Mucronix Reviews\" or a shortcode in a text element. In blogs of YOOtheme Pro show the stars with the field \"Stars (Summary)\" or the element, not with a shortcode in the intro text.</li></ul>"
