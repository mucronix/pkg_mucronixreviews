PLG_SYSTEM_MUCRONIXREVIEWS_XML_DESCRIPTION="Обрабатывает отзывы удалённого пользователя, добавляет рейтинг в разметку Schema.org, показывает число отзывов на модерации в меню и подключает YOOtheme Pro. Не выключайте этот плагин: пока он выключен, ничего из этого не работает."
